serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"
core-text = "=21.0.0"
core-graphics = "=0.24.0"
block = "=0.1.6"
