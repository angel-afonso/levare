[package]
name = "partitura"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["runtime-shaders"]
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
gpui.workspace = true
dirs = "=6.0.0"
ttf-parser = "=0.25.1"
score-core.workspace = true
