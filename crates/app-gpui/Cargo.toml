[package]
name = "levare"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["runtime-shaders", "vsco"]
runtime-shaders = ["gpui/runtime_shaders"]
vsco = ["dep:score-sound-vsco", "dep:score-sound-store"]

[dependencies]
atomic-write.workspace = true
gpui.workspace = true
# The tessellator GPUI 0.2.2 itself uses; glyphs are tessellated once and reused.
lyon = "=1.0.19"
dirs.workspace = true
ttf-parser.workspace = true
score-core.workspace = true
score-document.workspace = true
score-edit.workspace = true
score-layout.workspace = true
score-playback.workspace = true
score-io.workspace = true
score-export.workspace = true
score-pdf.workspace = true
score-platform.workspace = true
score-sound-vsco = { workspace = true, optional = true }
score-sound-store = { workspace = true, optional = true }
score-keymap.workspace = true
score-toolbar.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
agent-tools.workspace = true
agent-host.workspace = true
levare-update.workspace = true
futures.workspace = true
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "windows")'.dependencies]
# The version GPUI 0.2.2 uses: the keyboard layout and the wheel setting.
windows = { version = "=0.61.3", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Only a Windows host runs the resource compiler (see build.rs). The version
# GPUI already uses for its own manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"
core-text.workspace = true
core-graphics.workspace = true
block = "=0.1.6"

