[package]
name = "score-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
score-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
roxmltree = "=0.20.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
# Not used by score-io: it pins libc for the whole workspace, because 0.2.190
# dropped ENOATTR on Linux, which xattr 0.2.3 (under gpui_http_client) needs to
# compile there.
libc = "=0.2.189"
