[package]
name = "levare-update"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Linux updates come as .tar.gz and Windows updates as .zip; both are read
# on every OS so the install tests run everywhere.
flate2 = { workspace = true, features = ["zlib-rs"] }
minisign-verify = "=0.2.5"
# The same HTTP client score-sound-store downloads packs with.
zed-reqwest.workspace = true
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { version = "=0.4.46", default-features = false }
thiserror = "=2.0.21"
zip.workspace = true

[dev-dependencies]
# Signs test archives with throwaway keys; the crate itself only verifies.
minisign = "=0.8.0"
