[package]
name = "levare-update"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
minisign-verify = "=0.2.5"
# The same HTTP client score-sound-store downloads packs with.
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror = "=2.0.21"

[dev-dependencies]
# Signs test archives with throwaway keys; the crate itself only verifies.
minisign = "=0.8.0"
