[package]
name = "score-sound-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
score-sound-vsco = { path = "../sound-vsco" }
score-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
libc = "0.2"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The client GPUI already builds, used blocking from a background thread.
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots", "http2"] }

[dev-dependencies]
score-core.workspace = true
tempfile.workspace = true
