[package]
name = "score-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
score-core.workspace = true
score-layout.workspace = true
tempfile.workspace = true
ttf-parser = "=0.25.1"
serde_json.workspace = true
# The portable writer: krilla embeds and subsets fonts; rustybuzz is the shaper it
# uses itself, called directly here to measure text before drawing it.
krilla = { version = "=0.8.2", default-features = false }
rustybuzz = "=0.20.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
core-graphics = "=0.24.0"
core-foundation = "=0.10.0"
foreign-types = "=0.5.0"

[dev-dependencies]
score-io.workspace = true
flate2 = "=1.1.5"
