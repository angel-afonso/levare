# Third-party notices for the Rust crates built into Levare, written by the
# Release workflow (.github/scripts/collect-licenses.sh) with about.hbs. Only
# what the release builds link counts. Where a crate offers a choice of
# licenses, the first one listed here is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
