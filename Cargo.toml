[workspace]
members = ["crates/*"]
default-members = ["crates/app-gpui"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
score-core = { path = "crates/score-core" }
score-edit = { path = "crates/score-edit" }
score-layout = { path = "crates/score-layout" }
score-playback = { path = "crates/score-playback" }
score-io = { path = "crates/score-io" }
score-pdf = { path = "crates/score-pdf" }
score-export = { path = "crates/score-export" }
score-platform = { path = "crates/platform" }
score-document = { path = "crates/score-document" }
score-keymap = { path = "crates/keymap" }
score-toolbar = { path = "crates/toolbar" }
score-text = { path = "crates/score-text" }
agent-tools = { path = "crates/agent-tools" }
agent-host = { path = "crates/agent-host" }
levare-update = { path = "crates/update" }
atomic-write = { path = "crates/atomic-write" }
score-sound-vsco = { path = "crates/sound-vsco" }
score-sound-store = { path = "crates/sound-store" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
schemars = { version = "=1.2.3", features = ["derive"] }
imbl = { version = "=7.0.2", features = ["serde"] }
slotmap = { version = "=1.1.1", features = ["serde"] }
tempfile = "=3.27.0"
gpui = "=0.2.2"
cpal = { version = "=0.17.3", features = ["audio_thread_priority"] }
rustysynth = "=1.3.8"
rtrb = "=0.4.1"
assert_no_alloc = "=1.1.2"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net"] }
tokio-util = "=0.7.20"
futures = "=0.3.34"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "=0.13.5", default-features = false }
agent-client-protocol = "=3.5.0"
# The client GPUI already builds, used blocking from a background thread.
zed-reqwest = { version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
zip = { version = "=9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# No backend by default: each crate picks one.
flate2 = { version = "=1.1.10", default-features = false }
sha2 = "=0.11.1"
# Also pins libc for the whole workspace through score-sound-store, which uses it
# directly: 0.2.190 dropped ENOATTR on Linux, which xattr 0.2.3 (under
# gpui_http_client) needs to compile there.
libc = "=0.2.191"
dirs = "=7.0.0"
dunce = "=1.0.5"
roxmltree = "=0.21.2"
ttf-parser = "=0.25.1"
windows-sys = "=0.61.2"
core-text = "=22.0.0"
core-graphics = "=0.25.0"

# Large orchestral scores must stay fluid with `cargo run`: light optimization
# for our crates keeps rebuilds quick; dependencies (GPUI) are built once.
[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
debug = 0
opt-level = 3
