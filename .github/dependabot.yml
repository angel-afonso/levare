# Weekly pull requests with dependency updates: one for the Rust crates and
# one for the workflows' actions. Workspace dependencies are pinned with `=`,
# so each update is a deliberate change reviewed like any other.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
