name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes cold builds and caches much bigger, and CI only needs
  # it for backtraces.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: Format, clippy and tests
    # Levare is only built and validated on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The version comes from rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          # PRs reuse main's cache; saving one per PR costs minutes.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked


  # Levare is not ported to Linux and Windows yet; this shows how far each is
  # from working. It does not fail the run until the port is done.
  portability:
    name: Portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      # NTFS and Defender scanning make Windows builds slow; a trusted ReFS
      # Dev Drive avoids both. The build runs in its copy of the checkout.
      - name: Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 30GB
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      # What gpui needs to link on Linux (X11, Wayland and fonts), and ALSA
      # for audio and MIDI.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev \
            xvfb mesa-vulkan-drivers imagemagick

      - name: Toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        # --keep-going reports every crate that fails, not only the first.
        run: cargo check --workspace --all-targets --locked --keep-going

      # After a failed check too, so the lints of what does compile show.
      - name: Clippy
        if: ${{ !cancelled() }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build app
        if: ${{ !cancelled() }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo build -p levare --locked

      # Nobody has a Linux or Windows machine to try Levare on, so open it
      # here for 30 seconds: the log and a screenshot show whether the window
      # comes up and what it looks like. Linux uses a virtual X server with
      # Mesa's software Vulkan; Windows uses the runner's desktop.
      - name: Launch app (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          mkdir -p smoke
          xvfb-run --server-args="-screen 0 1600x1100x24" bash -c '
            RUST_BACKTRACE=1 target/debug/levare > smoke/levare.log 2>&1 &
            pid=$!
            sleep 30
            import -window root smoke/screen.png
            if kill -0 $pid 2>/dev/null; then echo "still running" >> smoke/levare.log; kill $pid; else wait $pid; echo "exited with $?" >> smoke/levare.log; fi
          '
          cat smoke/levare.log

      - name: Launch app (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:RUST_BACKTRACE = '1'
          $app = Start-Process target\debug\levare.exe -PassThru `
            -RedirectStandardOutput smoke\stdout.log -RedirectStandardError smoke\levare.log
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("smoke\screen.png")
          if ($app.HasExited) { "exited with $($app.ExitCode)" | Add-Content smoke\levare.log } else { "still running" | Add-Content smoke\levare.log; Stop-Process $app }
          Get-Content smoke\stdout.log, smoke\levare.log
          Copy-Item -Recurse smoke $env:GITHUB_WORKSPACE

      - name: Upload launch results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: launch-${{ runner.os }}
          path: smoke/
