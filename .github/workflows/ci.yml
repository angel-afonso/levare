name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes cold builds and caches much bigger, and CI only needs
  # it for backtraces.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version comes from rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

  # Known vulnerabilities, licenses Levare cannot ship (deny.toml allows the
  # same ones as about.toml, which the release's notices come from) and
  # crates from outside crates.io. Duplicate versions are only reported.
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Levare is built and tested on all three systems alike. Clippy runs on
  # each because the cfg-gated code differs between them.
  check:
    name: Clippy and tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # NTFS and Defender scanning make Windows builds slow; a trusted ReFS
      # Dev Drive avoids both. The build runs in its copy of the checkout.
      - name: Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 30GB
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      # What gpui needs to link on Linux (X11, Wayland and fonts), ALSA for
      # audio, and D-Bus for real-time audio threads; then a virtual X server
      # and window manager, a headless Wayland compositor, Mesa's software
      # Vulkan and the screenshot tools the launch below uses.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev \
            libdbus-1-dev \
            xvfb openbox sway grim mesa-vulkan-drivers vulkan-tools x11-utils imagemagick

      - name: Workspace
        run: echo "WORKSPACE=${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Toolchain
        working-directory: ${{ env.WORKSPACE }}
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE }}
          # PRs reuse main's cache; saving one per PR costs minutes.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        working-directory: ${{ env.WORKSPACE }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # After failing lints too, so one run shows both.
      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: ${{ env.WORKSPACE }}
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build app
        if: ${{ !cancelled() && runner.os != 'macOS' }}
        working-directory: ${{ env.WORKSPACE }}
        run: cargo build -p levare --locked

      # Open Levare for 30 seconds: the log and a screenshot show whether the
      # window comes up and what it looks like. Linux opens it on a virtual X
      # server with openbox and on a headless Wayland compositor, both with
      # Mesa's software Vulkan (lavapipe); Windows uses the runner's desktop.
      # The job fails only if Levare quits before then.
      - name: Launch app (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: .github/scripts/launch-linux.sh target/debug/levare smoke

      - name: Launch app (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: ${{ env.WORKSPACE }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:RUST_BACKTRACE = '1'
          $app = Start-Process target\debug\levare.exe -PassThru `
            -RedirectStandardOutput smoke\stdout.log -RedirectStandardError smoke\levare.log
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("smoke\screen.png")
          $exited = $app.HasExited
          if ($exited) { "exited with $($app.ExitCode)" | Add-Content smoke\levare.log } else { "still running" | Add-Content smoke\levare.log; Stop-Process $app }
          Get-Content smoke\stdout.log, smoke\levare.log
          Copy-Item -Recurse smoke $env:GITHUB_WORKSPACE
          if ($exited) { Write-Output "::error::Levare quit within 30 seconds of starting."; exit 1 }

      - name: Upload launch results
        if: ${{ !cancelled() && runner.os != 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: launch-${{ runner.os }}
          path: smoke/
