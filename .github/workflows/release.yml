name: Release

# A push to main whose `[workspace.package] version` has no `v*` tag yet (the
# merged release-plz pull request) tags that version, builds Levare for macOS
# (one universal app for Apple Silicon and Intel), Linux and Windows (x86_64)
# and publishes it as a GitHub release. A `v*` tag pushed by hand does the
# same for that tag. Running it by hand (from any branch) never tags or
# publishes: it only builds every archive and keeps them as workflow
# artifacts. The release pull request comes from the Release PR workflow, run
# by hand. docs/releasing.md explains the whole process and the secrets it
# uses.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The app reports the Cargo.toml version (the bundle and the updater read
  # it), so the release is tagged from it. Outputs the version, the tag to
  # publish (empty when nothing is released) and whether to build.
  version:
    name: Version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      # A tag pushed with the workflow's token starts no other run, so this
      # run goes on to build and publish it. Without the update signing key
      # nothing is tagged or built: a release the updater cannot verify would
      # be one installed copies never receive.
      - name: Tag the version
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          HAS_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::No version in [workspace.package] of Cargo.toml."
            exit 1
          fi
          echo "Cargo.toml version: $version"
          tag="" build=true
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $version; bump [workspace.package] version to ${GITHUB_REF_NAME#v} or tag v$version."
              exit 1
            fi
            if [[ "$HAS_SIGNING_KEY" != true ]]; then
              echo "::error::UPDATE_SIGNING_KEY is not set; see docs/releasing.md."
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          elif [[ "$EVENT" == push ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "v$version is already released; nothing to build."
              build=false
            elif [[ "$HAS_SIGNING_KEY" != true ]]; then
              # Building would cost a full run (and notarizations) for
              # nothing; run the workflow by hand for a test build.
              echo "::warning::UPDATE_SIGNING_KEY is not set, so v$version is not tagged, built or published. See docs/releasing.md."
              build=false
            else
              tag="v$version"
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
              echo "Tagged $tag."
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  # The SFZ engine each release ships: in Contents/Frameworks on macOS, next
  # to the executable on Linux and Windows. It changes only with
  # scripts/build_sfizz.sh, so it is cached per OS on that file.
  sfizz:
    name: sfizz engine (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest runner, like the app, so the library needs no
        # newer glibc or libstdc++ than Levare does.
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows; the script drives cmake and Visual Studio.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        id: cache
        with:
          path: sfizz
          key: sfizz-${{ runner.os }}-${{ hashFiles('scripts/build_sfizz.sh') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build_sfizz.sh sfizz

      - uses: actions/upload-artifact@v4
        with:
          name: sfizz-${{ runner.os }}
          path: sfizz/
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The version comes from rust-toolchain.toml.
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p levare --target ${{ matrix.target }}

      # Only compiled here; the macos-universal job merges both architectures
      # into one app and signs and packages it.
      - name: Keep the binary
        run: |
          mkdir -p bin
          cp target/${{ matrix.target }}/release/levare bin/levare

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bin/
          if-no-files-found: error

  # One app for both Apple Silicon and Intel Macs: the two binaries merged
  # with lipo into a universal binary, which macOS runs natively on either.
  macos-universal:
    name: macOS universal app
    needs: [version, sfizz, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*-apple-darwin
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: sfizz-macOS
          path: sfizz

      - name: Universal binary
        run: |
          lipo -create -output levare \
            bin/bin-aarch64-apple-darwin/levare \
            bin/bin-x86_64-apple-darwin/levare
          chmod +x levare
          archs="$(lipo -archs levare)"
          echo "levare architectures: $archs"
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
            echo "::error::The universal binary is missing an architecture: $archs"
            exit 1
          fi

      - name: Archive name
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG:-${GITHUB_SHA::7}}"
          echo "ARCHIVE=levare-$version-universal-apple-darwin" >> "$GITHUB_ENV"

      # The same bundle scripts/bundle_macos.py makes locally: the binary, the
      # icon, sfizz in Frameworks, and Info.plist with this version.
      - name: App bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app="dist/$ARCHIVE/Levare.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/licenses" "$app/Contents/Frameworks"
          cp levare "$app/Contents/MacOS/levare"
          cp assets/branding/levare/Levare.icns "$app/Contents/Resources/Levare.icns"
          cp sfizz/libsfizz.dylib "$app/Contents/Frameworks/libsfizz.dylib"
          cp -R sfizz/licenses/sfizz "$app/Contents/Resources/licenses/sfizz"
          plist="$app/Contents/Info.plist"
          cp packaging/macos/Info.plist "$plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$plist"
          plutil -lint "$plist"

      # With the Apple secrets set, the app is signed with the Developer ID
      # certificate, notarized and stapled, so Gatekeeper opens it without a
      # warning. Without them it falls back to an ad-hoc signature (Apple
      # Silicon refuses to run unsigned binaries) and users have to right-click
      # → Open the first time.
      - name: Sign and notarize
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          app="dist/$ARCHIVE/Levare.app"
          if [[ -z "$MACOS_CERTIFICATE" || -z "$APPLE_API_KEY" ]]; then
            echo "::warning::Apple signing secrets are not set; Levare.app gets an ad-hoc signature and is not notarized."
            codesign --force --deep --sign - "$app"
            exit 0
          fi

          # A throwaway keychain holding only the Developer ID certificate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Keep the existing keychains in the search list (their paths have no spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi

          # Notarization requires the hardened runtime and a secure timestamp.
          # sfizz is signed first, so the app's signature seals the signed
          # library; the hardened runtime only loads libraries signed by the
          # same team.
          sign=(codesign --force --options runtime --timestamp --sign "$identity")
          "${sign[@]}" "$app/Contents/Frameworks/libsfizz.dylib"
          "${sign[@]}" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # The installer step signs and notarizes the disk image with these.
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Levare-notarize.zip"
          .github/scripts/notarize.sh "$RUNNER_TEMP/Levare-notarize.zip"

          # Staple the ticket so the app opens offline without asking Apple.
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

      # What the in-app updater downloads and installs.
      - name: Archive
        run: (cd dist && ditto -c -k --keepParent "$ARCHIVE" "$ARCHIVE.zip")

      # The installer: a disk image with Levare.app next to a link to
      # /Applications, so installing is dragging one onto the other. With the
      # Apple secrets it is signed, notarized and stapled like the app.
      - name: Installer
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          staging="$RUNNER_TEMP/dmg"
          dmg="dist/$ARCHIVE.dmg"
          mkdir -p "$staging"
          ditto "dist/$ARCHIVE/Levare.app" "$staging/Levare.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Levare -srcfolder "$staging" -fs HFS+ -format UDZO -ov "$dmg"

          if [[ -z "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "::warning::Apple signing secrets are not set; the disk image is not signed or notarized."
            exit 0
          fi
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          .github/scripts/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  # Linux and Windows: the release build next to sfizz in one folder, packed
  # as the archive users download and the in-app updater installs.
  package:
    name: Build (${{ matrix.target }})
    needs: [version, sfizz]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner, so the binary runs on any distribution
          # with glibc 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # NTFS and Defender scanning make Windows builds slow; a trusted ReFS
      # Dev Drive avoids both. The build runs in its copy of the checkout.
      - name: Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 30GB
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      # What gpui needs to link on Linux (X11, Wayland and fonts), ALSA for
      # audio, and D-Bus for real-time audio threads.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev \
            libdbus-1-dev imagemagick

      - name: Workspace
        run: echo "WORKSPACE=${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      # The version comes from rust-toolchain.toml.
      - name: Toolchain
        working-directory: ${{ env.WORKSPACE }}
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE }}
          key: ${{ matrix.target }}

      - name: Build
        working-directory: ${{ env.WORKSPACE }}
        run: cargo build --release --locked -p levare --target ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: sfizz-${{ runner.os }}
          path: ${{ env.WORKSPACE }}/sfizz

      - name: Archive name
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG:-${GITHUB_SHA::7}}"
          echo "ARCHIVE=levare-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      # levare/ holds the executable, libsfizz.so, a desktop entry with its
      # icon and an install script that adds it to the user's menu.
      - name: Linux archive
        if: runner.os == 'Linux'
        working-directory: ${{ env.WORKSPACE }}
        run: |
          folder="stage/levare"
          mkdir -p "$folder/licenses" dist
          cp target/${{ matrix.target }}/release/levare "$folder/levare"
          # Rust's release profile keeps the standard library's symbols.
          strip "$folder/levare"
          cp sfizz/libsfizz.so "$folder/libsfizz.so"
          cp -R sfizz/licenses/sfizz "$folder/licenses/sfizz"
          cp packaging/linux/dev.partitura.editor.desktop packaging/linux/install.sh packaging/linux/README.txt "$folder/"
          convert assets/branding/levare/icon-macos-v2.png -resize 256x256 "$folder/levare.png"
          chmod 755 "$folder/levare" "$folder/install.sh"
          chmod 644 "$folder/libsfizz.so"

          # What it needs from the system, and the newest glibc symbol it
          # uses: the oldest distribution it runs on.
          ldd "$folder/levare"
          glibc="$(objdump -T "$folder/levare" "$folder/libsfizz.so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "Newest glibc symbol: $glibc"
          echo "::notice::Linux build needs $glibc or newer"

          tar -C stage -czf "dist/$ARCHIVE.tar.gz" --owner=0 --group=0 levare
          tar -tzvf "dist/$ARCHIVE.tar.gz"

      # Levare/ holds levare.exe and sfizz.dll, which needs nothing else (it
      # links the C runtime statically).
      - name: Windows archive
        if: runner.os == 'Windows'
        working-directory: ${{ env.WORKSPACE }}
        run: |
          folder="stage/Levare"
          mkdir -p "$folder/licenses" dist
          cp target/${{ matrix.target }}/release/levare.exe "$folder/levare.exe"
          cp sfizz/sfizz.dll "$folder/sfizz.dll"
          cp -R sfizz/licenses/sfizz "$folder/licenses/sfizz"
          (cd stage && 7z a -tzip -mx=9 "../dist/$ARCHIVE.zip" Levare >/dev/null)
          7z l "dist/$ARCHIVE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.WORKSPACE }}/dist/*.tar.gz
            ${{ env.WORKSPACE }}/dist/*.zip
          if-no-files-found: error

  # Signs the archive the in-app updater installs and writes latest.json,
  # which the app reads from the latest release to find new versions.
  update-manifest:
    name: Update manifest
    needs: [version, macos-universal, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: levare-*
          path: dist
          merge-multiple: true

      - name: Sign and write latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set; no latest.json for this run."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          tag="${TAG:-${GITHUB_SHA::7}}"
          key="$RUNNER_TEMP/update.key"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          UPDATE_SIGNING_KEY_PATH="$key" .github/scripts/update-manifest.sh dist "$VERSION" "$tag" "$GITHUB_REPOSITORY"
          rm "$key"
          mkdir update
          mv dist/latest.json dist/*.minisig update/

      - uses: actions/upload-artifact@v4
        with:
          name: levare-update
          path: update/
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: needs.version.outputs.tag != ''
    needs: [version, macos-universal, package, update-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: levare-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ ! -f dist/latest.json ]]; then
            echo "::error::No latest.json; the updater would find nothing to install."
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Levare $TAG" \
            --generate-notes

      # Point the website's download links at the new release.
      - name: Update the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
