# Groups the commits by their conventional type; merge commits (from pull
# requests or local merges) repeat their branch's commits, so they are left out.
[changelog]
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "^chore: (publica|release)", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs?", group = "Documentation" },
    { message = "^revert", group = "Reverted" },
    { message = "^(test|style|ci)", skip = true },
    { message = ".*", group = "Other" },
]
